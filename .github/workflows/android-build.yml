name: Android APK

on:
  push:
    branches: ["claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch whisper.cpp (pinned)
        run: ./scripts/fetch-whisper.sh

      - name: Verify pinned model checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, hashlib, urllib.request, sys
          src = open("app/src/main/java/com/handymobile/app/model/ModelManager.kt").read()
          models = re.findall(r'\("(ggml-[^"]+)",\s*([0-9_]+)L,\s*"([0-9a-f]{64})"', src)
          assert models, "no models found"
          for name, size, sha in models:
              size = int(size.replace("_", ""))
              url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/" + name
              h = hashlib.sha256(); n = 0
              with urllib.request.urlopen(url) as r:
                  while chunk := r.read(1 << 20):
                      h.update(chunk); n += len(chunk)
              print(f"{name}: size={n} expected={size} sha256={h.hexdigest()} expected={sha}")
              if n != size or h.hexdigest() != sha:
                  sys.exit(f"{name}: size or checksum mismatch")
          PY

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: handy-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
