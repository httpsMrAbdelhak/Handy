name: Android APK

on:
  push:
    branches: ["claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch whisper.cpp (pinned)
        run: ./scripts/fetch-whisper.sh

      - name: Verify pinned model checksum
        run: |
          set -euo pipefail
          SHA=$(grep -oP 'SHA256 = "\K[0-9a-f]{64}' app/src/main/java/com/handymobile/app/model/ModelManager.kt)
          SIZE=$(grep -oP 'SIZE_BYTES = \K[0-9_]+' app/src/main/java/com/handymobile/app/model/ModelManager.kt | tr -d _)
          URL=$(grep -oP 'URL = "\Khttps[^"]+' app/src/main/java/com/handymobile/app/model/ModelManager.kt)
          curl -fsSL -o /tmp/model.bin "$URL"
          echo "size=$(stat -c %s /tmp/model.bin) expected=$SIZE"
          echo "sha256=$(sha256sum /tmp/model.bin | cut -d' ' -f1) expected=$SHA"
          [ "$(stat -c %s /tmp/model.bin)" = "$SIZE" ]
          echo "$SHA  /tmp/model.bin" | sha256sum -c -

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: handy-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
